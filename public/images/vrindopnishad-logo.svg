<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vrindoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="vrindoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="url(#vrindoGrad)" stroke-width="2.5" />
  <!-- Sacred Petals / Flame Geometric Emblem -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <!-- Center Lotus / Flame Core -->
    <path d="M 0,-24 C 12,-12 16,4 0,22 C -16,4 -12,-12 0,-24 Z" fill="url(#vrindoGlow)" />
    <!-- Left Petal -->
    <path d="M -4,-6 C -18,-18 -26,0 -8,16 C -3,13 -2,4 -4,-6 Z" fill="url(#vrindoGrad)" opacity="0.85" />
    <!-- Right Petal -->
    <path d="M 4,-6 C 18,-18 26,0 8,16 C 3,13 2,4 4,-6 Z" fill="url(#vrindoGrad)" opacity="0.85" />
    <!-- Inner Spark / Bindu -->
    <circle cx="0" cy="-2" r="3.5" fill="#FEF3C7" />
  </g>
</svg>
